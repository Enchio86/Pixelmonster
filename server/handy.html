<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Buddy Beast Fernbedienung</title>
<link rel="manifest" href="/handy/manifest.json">
<link rel="icon" href="/handy/icon-192.png">
<link rel="apple-touch-icon" href="/handy/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Buddy Beast">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#120e18;--panel:#1f1a28;--panel2:#2c2538;--text:#f3ecdf;--muted:#a99fb8;--accent:#e2b65c;--good:#5fd38a;--bad:#ff6b6b;--warn:#ffb347}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#2a2036,var(--bg) 60%) fixed;background-color:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:460px;margin:0 auto}
h1{font:700 20px Georgia,serif;color:var(--accent);margin:4px 0 14px;text-align:center}
.card{background:var(--panel);border:1px solid #3a3048;border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #4a3e5c;background:var(--panel2);color:var(--text);font-size:22px;letter-spacing:4px;text-transform:uppercase;text-align:center}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid #4a3e5c;border-radius:14px;padding:12px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(#e9c477,#b8945a);color:#1a1208;border:0;font-weight:700;width:100%;margin-top:10px}
button:disabled{opacity:.45}
.mon{display:flex;gap:12px;align-items:center}
.mon img{width:120px;height:120px;flex:none;background:#17121f;border-radius:14px}
.mon .t{font-weight:700;font-size:18px}
.bar{margin:7px 0}
.bar label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.track{height:10px;background:#120e18;border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .4s}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:28px;padding:12px 4px}
.acts span{font-size:13px;color:var(--muted)}
.status{font-size:14px;margin-top:8px}
ul{list-style:none;margin:0;padding:0}
li{font-size:14px;padding:6px 0;border-bottom:1px solid #2c2538}
li time{color:var(--muted);margin-right:6px}
.pill{display:inline-block;background:var(--panel2);border-radius:20px;padding:2px 9px;font-size:13px;margin:4px 4px 0 0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:428px;margin:0 auto;background:#2c2538;border:1px solid var(--accent);border-radius:12px;padding:12px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
a{color:var(--accent)}
#chatLog{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:#3a3150;border-bottom-right-radius:4px}
.bub.mon{align-self:flex-start;background:#2a2238;border:1px solid #4a3e5c;border-bottom-left-radius:4px}
.bub.wait{opacity:.7;font-style:italic}
.chatrow{display:flex;gap:8px}
.chatrow input{font-size:16px;letter-spacing:0;text-transform:none;text-align:left;padding:12px}
.chatrow button{flex:none;font-size:20px;padding:10px 14px}
</style>
</head>
<body>
<main>
<h1>📱 Buddy Beast</h1>
<div id="app"></div>
<div id="chat"></div>
<div id="install"></div>
</main>
<div id="toast"></div>
<script>
const KEY='pixelmonster.remote';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=null,last=null,timer=null,toastT=null;
try{token=localStorage.getItem(KEY)}catch(e){}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
async function api(path,body){
  let r;
  try{r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Remote '+token}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){throw Error('Keine Verbindung. Bist du online?')}
  const d=await r.json().catch(()=>({error:'Ungültige Antwort vom Server.'}));
  if(r.status===401&&token){unpairLocal();throw Error(d.error)}
  if(!r.ok||d.error)throw Error(d.error||'Fehler '+r.status);
  return d;
}
function unpairLocal(){token=null;try{localStorage.removeItem(KEY)}catch(e){}clearInterval(timer);$('#chat').innerHTML='';renderPair()}
function renderPair(){
  $('#app').innerHTML=`<div class="card"><p>Steuere dein Monster vom Handy aus.</p>
    <ol class="muted" style="padding-left:20px"><li>Öffne am PC die Buddy-Beast-App und klick oben rechts auf <b>⚙️</b>.</li><li>Tippe dort auf <b>📱 Handy koppeln</b>.</li><li>Gib den Code hier ein.</li></ol>
    <input id="code" maxlength="7" autocomplete="off" placeholder="ABC123">
    <button class="primary" id="pairBtn">Koppeln</button></div>
`;
  $('#pairBtn').onclick=pair;$('#code').onkeydown=e=>{if(e.key==='Enter')pair()};
}
async function pair(){
  const code=$('#code').value.trim();if(!code)return;
  try{const d=await api('/pair/claim',{code});token=d.token;try{localStorage.setItem(KEY,token)}catch(e){}toast('Gekoppelt!');start()}
  catch(e){toast(e.message)}
}
const ACTS=[['feed','🍙','Füttern'],['snack','🍓','Beere'],['play','⚽','Spielen'],['clean','🧽','Putzen'],['sleep','💤','Schlafen'],['med','💊','Medizin']];
function ago(ms){const s=Math.round(ms/1000);return s<60?`vor ${s} s`:s<3600?`vor ${Math.round(s/60)} min`:s<86400?`vor ${Math.round(s/3600)} h`:`vor ${Math.round(s/86400)} Tagen`}
function bar(lbl,v){v=Math.max(0,Math.min(100,v||0));const c=v>50?'var(--good)':v>20?'var(--warn)':'var(--bad)';return`<div class="bar"><label>${lbl}<span>${Math.round(v)}</span></label><div class="track"><div class="fill" style="width:${v}%;background:${c}"></div></div></div>`}
function render(){
  const d=last;if(!d)return;const s=d.status;
  if(!s){$('#app').innerHTML=`<div class="card"><p>Gekoppelt! Sobald die PC-App online ist, erscheint hier dein Monster.</p><p class="muted">Die PC-App muss im Tab 🌐 Online verbunden sein.</p></div>${footer()}`;bindFooter();return}
  const age=d.now-d.updated,live=age<45000;
  const flags=[s.sick&&'🤒 krank',s.poop&&`💩 ×${s.poop}`,s.sleeping&&'💤 schläft',s.pension&&'🏨 in der Pension',s.quest&&'🧭 auf Quest',s.stage===0&&'🥚 noch ein Ei'].filter(Boolean);
  $('#app').innerHTML=`<div class="card"><div class="mon">${d.sprite?`<img src="${d.sprite}" alt="">`:''}<div><div class="t">${esc(s.name)}</div><div class="muted">${esc(s.species)} · Lv ${s.level}</div>
      <div>${flags.map(f=>`<span class="pill">${f}</span>`).join('')}<span class="pill">🍓 ${s.beere}</span></div></div></div>
    <div class="status">${live?`<span style="color:var(--good)">● PC verbunden</span> <span class="muted">· Stand ${ago(age)}</span>`:`<span style="color:var(--warn)">⚠️ Die PC-App ist gerade nicht online</span> <span class="muted">(zuletzt ${ago(age)}). Befehle warten, bis sie wieder läuft.</span>`}</div>
    ${d.pending?`<div class="status muted">⏳ ${d.pending} ${d.pending===1?'Befehl ist':'Befehle sind'} unterwegs …</div>`:''}</div>
    <div class="card">${bar('🍙 Sattheit',s.hunger)+bar('😊 Laune',s.mood)+bar('⚡ Energie',s.energy)+bar('🧽 Sauberkeit',s.clean)+bar('❤️ Gesundheit',s.health)}</div>
    <div class="card acts">${ACTS.map(([k,i,l])=>`<button data-cmd="${k}">${k==='sleep'&&s.sleeping?'☀️':i}<span>${k==='sleep'&&s.sleeping?'Wecken':l}</span></button>`).join('')}</div>
    <div class="card"><div class="muted" style="margin-bottom:4px">Tagebuch</div><ul>${(s.log||[]).map(l=>`<li><time>${new Date(l.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</time>${esc(l.m)}</li>`).join('')}</ul></div>${footer()}`;
  document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));bindFooter();
}
function footer(){return`<p style="text-align:center"><a href="#" id="unpair">Handy entkoppeln</a></p>`}
function bindFooter(){$('#unpair').onclick=e=>{e.preventDefault();if(confirm('Dieses Handy wirklich entkoppeln?'))unpairLocal()}}
async function send(cmd){
  try{last=await api('/r/cmd',{cmd});render();toast(last.now-last.updated<45000?'Gesendet. Kommt in ein paar Sekunden an.':'Gesendet. Kommt an, sobald die PC-App läuft.')}
  catch(e){toast(e.message)}
}
async function poll(){try{last=await api('/r/status');render();if(!$('#chatLog'))renderChat()}catch(e){if(token)toast(e.message)}}
// ---------- Reden: Chat mit dem Monster, Antworten werden vorgelesen ----------
const CKEY='pixelmonster.chat';let chat=[],chatBusy=false,voiceOff=false;
try{chat=JSON.parse(localStorage.getItem(CKEY)||'[]');voiceOff=localStorage.getItem(CKEY+'.voice')==='off'}catch(e){}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function saveChat(){try{localStorage.setItem(CKEY,JSON.stringify(chat.slice(-40)))}catch(e){}}
function speak(text){
  if(voiceOff||!window.speechSynthesis)return;const t=text.replace(/\*[^*]*\*/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').trim();if(!t)return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';const v=speechSynthesis.getVoices().find(v=>/^de/i.test(v.lang));if(v)u.voice=v;
  const st=last?.status?.stage??1;u.pitch=[1.9,1.9,1.4,.7][st]??1;u.rate=[1.15,1.15,1.05,.92][st]??1;speechSynthesis.speak(u);
}
function renderChat(){
  const s=last?.status,box=$('#chat');if(!s||!token){box.innerHTML='';return}
  if(s.stage===0){box.innerHTML='';return}
  const keep=$('#chatIn')?.value||'';
  box.innerHTML=`<div class="card"><div class="muted" style="margin-bottom:8px">💬 Mit ${esc(s.name)} reden</div><div id="chatLog">
    ${chat.length?'':`<div class="muted" style="text-align:center">Sag ${esc(s.name)} hallo!</div>`}
    ${chat.map(m=>`<div class="bub ${m.role==='user'?'me':'mon'}">${esc(m.content)}</div>`).join('')}${chatBusy?`<div class="bub mon wait">${esc(s.name)} denkt nach …</div>`:''}</div>
    <div class="chatrow"><input id="chatIn" maxlength="300" placeholder="Schreib etwas …" autocomplete="off">${SR?'<button id="micBtn">🎤</button>':''}<button id="sendBtn" ${chatBusy?'disabled':''}>➤</button></div>
    <div class="muted" style="margin-top:8px;display:flex;justify-content:space-between"><label><input type="checkbox" id="voiceCb" style="width:auto" ${voiceOff?'':'checked'}> 🔊 Vorlesen</label>${chat.length?'<a href="#" id="chatClr">Verlauf löschen</a>':''}</div></div>`;
  const log=$('#chatLog');log.scrollTop=log.scrollHeight;$('#chatIn').value=keep;
  $('#chatIn').onkeydown=e=>{if(e.key==='Enter')sendChat()};$('#sendBtn').onclick=sendChat;
  $('#voiceCb').onchange=e=>{voiceOff=!e.target.checked;try{localStorage.setItem(CKEY+'.voice',voiceOff?'off':'on')}catch(x){}};
  if($('#chatClr'))$('#chatClr').onclick=e=>{e.preventDefault();chat=[];saveChat();renderChat()};
  if($('#micBtn'))$('#micBtn').onclick=()=>{const r=new SR();r.lang='de-DE';$('#micBtn').textContent='👂';
    r.onresult=e=>{$('#chatIn').value=e.results[0][0].transcript;sendChat()};r.onerror=()=>toast('Spracheingabe klappt gerade nicht.');r.onend=()=>{if($('#micBtn'))$('#micBtn').textContent='🎤'};r.start()};
}
async function sendChat(){
  const text=$('#chatIn')?.value.trim();if(!text||chatBusy)return;
  chat.push({role:'user',content:text});$('#chatIn').value='';chatBusy=true;renderChat();
  try{const d=await api('/r/chat',{messages:chat.slice(-12)});chat.push({role:'assistant',content:d.reply});speak(d.reply)}
  catch(e){toast(e.message);chat.pop();chatBusy=false;renderChat();$('#chatIn').value=text;return}
  chatBusy=false;saveChat();renderChat();
}
function start(){$('#app').innerHTML='<div class="card muted">Lade …</div>';poll();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)poll()},5000)}
// Als App installieren: Android/Chrome zeigt einen Knopf, iPhone bekommt eine Anleitung
let installEv=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function renderInstall(){
  const box=$('#install');if(standalone){box.innerHTML='';return}
  if(installEv)box.innerHTML='<button class="primary" id="instBtn">📲 Als App installieren</button>';
  else if(/iPhone|iPad|iPod/.test(navigator.userAgent))box.innerHTML='<div class="card muted">📲 <b>Als App aufs iPhone:</b> Unten in Safari auf <b>Teilen</b> (Quadrat mit Pfeil) tippen, dann <b>Zum Home-Bildschirm</b>.</div>';
  else box.innerHTML='<div class="card muted">📲 <b>Als App aufs Handy:</b> Im Browser-Menü (⋮) auf <b>App installieren</b> oder <b>Zum Startbildschirm hinzufügen</b> tippen.</div>';
  const b=$('#instBtn');if(b)b.onclick=async()=>{installEv.prompt();await installEv.userChoice.catch(()=>{});installEv=null;renderInstall()};
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;renderInstall()});
addEventListener('appinstalled',()=>{installEv=null;toast('Installiert! Du findest Buddy Beast jetzt bei deinen Apps.');$('#install').innerHTML=''});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/handy/sw.js',{scope:'/handy/'}).catch(()=>{});
renderInstall();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)poll()});
token?start():renderPair();
</script>
</body>
</html>
